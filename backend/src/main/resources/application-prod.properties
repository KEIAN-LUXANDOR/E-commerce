# Production settings. Used only when the app runs with SPRING_PROFILES_ACTIVE=prod (on Azure).
# Secrets come from environment variables (App Service settings / Key Vault). They have NO defaults:
# if one is missing, the app refuses to start instead of running with a wrong value.

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Website
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend-url=${FRONTEND_URL}

# Login cookie only over HTTPS; trust Azure's HTTPS proxy headers
server.servlet.session.cookie.secure=true
server.forward-headers-strategy=framework

# Health check: say UP/DOWN only, no details
management.endpoint.health.show-details=never

# Email (Azure Communication Services SMTP)
spring.mail.host=${MAIL_HOST:smtp.azurecomm.net}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.mail.from=${MAIL_FROM}

# Razorpay LIVE keys
app.razorpay.key-id=${RAZORPAY_KEY_ID}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET}

# Shop
app.store.currency=${STORE_CURRENCY:USD}
app.shipping.countries=${SHIPPING_COUNTRIES:}

# Logs: Azure collects console output, so no log file
logging.level.root=INFO
logging.file.name=