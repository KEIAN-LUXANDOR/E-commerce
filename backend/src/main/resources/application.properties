spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/shop
spring.datasource.username=shop
spring.datasource.password=shop_local_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Website addresses allowed to call the API (comma-separated, no spaces)
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001

# First admin account, read from environment variables (never write real values here)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Login session
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Never send internal error details to the browser
spring.web.error.include-stacktrace=never
spring.web.error.include-message=never

# Email (local: Mailpit on port 1025; production values come from environment variables)
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.from=${MAIL_FROM:no-reply@localhost}

# Website address used inside email links
app.frontend-url=${FRONTEND_URL:http://localhost:3001}