spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5433/shop
spring.datasource.username=shop
spring.datasource.password=shop_local_password

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Website addresses allowed to call the API (Next.js runs on 3000 locally)
app.cors.allowed-origins=http://localhost:3000

# First admin account, read from environment variables (never write real values here)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Login session
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax